<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ClaudPlay - Jogando</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
html, body{ margin:0; padding:0; width:100%; height:100%; background:#000; color:#fff; font-family:Arial, sans-serif; overflow:hidden; }
#game{ width:100vw; height:100vh; }
.voltar{ position:fixed; top:8px; left:8px; z-index:10; background:rgba(0,0,0,.6); color:#fff; padding:6px 12px; border-radius:8px; text-decoration:none; font-size:14px; }
.erro{ text-align:center; margin-top:40vh; padding:0 20px; }
</style>
</head>

<body>
<a class="voltar" href="javascript:history.back()">⬅ Voltar</a>
<div id="game"></div>

<script>
// Uso: jogar.html?core=snes&rom=SuperNintendo/roms/arquivo.smc&nome=Titulo
// "rom" é um caminho relativo à pasta Emuladores/.
const params = new URLSearchParams(window.location.search);
const core = params.get("core");
const rom = params.get("rom");
const nome = params.get("nome");

const coresPermitidos = ["gb", "gbc", "gba", "nes", "snes", "n64", "segaMD", "psx"];

function erro(msg){
  document.getElementById("game").innerHTML = "<h2 class='erro'>" + msg + "</h2>";
}

if (!rom || !core) {
  erro("Nenhum jogo selecionado");
} else if (!coresPermitidos.includes(core) || rom.includes("://") || rom.startsWith("/")) {
  erro("Jogo inválido");
} else {
  // Codifica cada parte do caminho (nomes com espaço, [!], &, ' etc.)
  const romUrl = rom.split("/").map(encodeURIComponent).join("/");
  const nomeJogo = nome || rom.split("/").pop().replace(/\.[^.]+$/, "");

  document.title = nomeJogo + " - ClaudPlay";

  window.EJS_player = "#game";
  window.EJS_core = core;
  window.EJS_gameName = nomeJogo;
  window.EJS_gameUrl = romUrl;
  window.EJS_language = "pt-BR";
  window.EJS_startOnLoaded = true;
  // Evita travamento no celular (GitHub Pages não libera threads)
  window.EJS_threads = false;
  // Usa a cópia do EmulatorJS que já está no repositório
  window.EJS_pathtodata = "../emulatorjs/EmulatorJS/Data/";

  const script = document.createElement("script");
  script.src = "../emulatorjs/EmulatorJS/Data/loader.js";
  document.body.appendChild(script);
}
</script>
</body>
</html>
