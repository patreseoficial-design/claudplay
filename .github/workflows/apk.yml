# Gera o APK Android do ClaudPlay e publica em Releases (tag "apk").
# Link direto: https://github.com/<dono>/<repo>/releases/download/apk/ClaudPlay.apk
name: Gerar APK

on:
  push:
    branches: [main, claude/beautiful-archimedes-rzt494]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Capacitor
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Montar arquivos do app
        working-directory: app
        run: bash montar-www.sh

      - name: Criar projeto Android
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android

      - name: Ícone do app
        working-directory: app
        continue-on-error: true
        run: |
          mkdir -p assets
          cp ../icons/icon-512.png assets/icon-only.png
          cp ../icons/icon-512.png assets/icon-foreground.png
          cp ../icons/icon-512.png assets/logo.png
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#07070c' --iconBackgroundColorDark '#07070c' \
            --splashBackgroundColor '#07070c' --splashBackgroundColorDark '#07070c'

      - name: Compilar APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../ClaudPlay.apk
          ls -la ../../ClaudPlay.apk

      - name: Guardar APK nesta execução
        uses: actions/upload-artifact@v4
        with:
          name: ClaudPlay-apk
          path: ClaudPlay.apk

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk ClaudPlay.apk \
            --target "$GITHUB_SHA" \
            --title "ClaudPlay para Android" \
            --notes "APK gerado automaticamente a partir de ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Baixe ClaudPlay.apk abaixo e instale no celular (permita 'instalar apps de fontes desconhecidas')."
